<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f3eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="200" r="180" fill="url(#catGradient)" opacity="0.1"/>

  <!-- Cat body -->
  <ellipse cx="200" cy="220" rx="80" ry="90" fill="#4a1d8f" filter="url(#glow)"/>

  <!-- Cat head -->
  <circle cx="200" cy="130" r="60" fill="#5528d9" filter="url(#glow)"/>

  <!-- Left ear -->
  <path d="M 160 85 L 150 40 L 170 80 Z" fill="#6f3eff" filter="url(#glow)"/>

  <!-- Right ear -->
  <path d="M 240 85 L 250 40 L 230 80 Z" fill="#6f3eff" filter="url(#glow)"/>

  <!-- Inner ear left -->
  <path d="M 160 80 L 158 55 L 168 75 Z" fill="#ff8a65"/>

  <!-- Inner ear right -->
  <path d="M 240 80 L 242 55 L 232 75 Z" fill="#ff8a65"/>

  <!-- Left eye white -->
  <circle cx="175" cy="120" r="18" fill="white" filter="url(#glow)"/>

  <!-- Right eye white -->
  <circle cx="225" cy="120" r="18" fill="white" filter="url(#glow)"/>

  <!-- Left pupil -->
  <circle cx="175" cy="120" r="10" fill="white" opacity="0.3"/>
  <circle cx="177" cy="118" r="8" fill="#1a1a2e"/>

  <!-- Right pupil (quantum eye) -->
  <circle cx="225" cy="120" r="10" fill="white" opacity="0.3"/>
  <circle cx="225" cy="120" r="7" fill="url(#catGradient)"/>
  <circle cx="227" cy="118" r="2" fill="white"/>

  <!-- Nose -->
  <path d="M 200 145 L 195 155 L 205 155 Z" fill="#ff8a65"/>

  <!-- Mouth -->
  <path d="M 200 155 Q 190 165 180 160" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 200 155 Q 210 165 220 160" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="150" y1="130" x2="110" y2="125" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="150" y1="145" x2="110" y2="150" stroke="white" stroke-width="1.5" opacity="0.8"/>

  <!-- Whiskers right -->
  <line x1="250" y1="130" x2="290" y2="125" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="250" y1="145" x2="290" y2="150" stroke="white" stroke-width="1.5" opacity="0.8"/>

  <!-- Front left paw -->
  <ellipse cx="160" cy="300" rx="25" ry="35" fill="#5528d9" filter="url(#glow)"/>

  <!-- Front right paw -->
  <ellipse cx="240" cy="300" rx="25" ry="35" fill="#5528d9" filter="url(#glow)"/>

  <!-- Paw pads -->
  <ellipse cx="160" cy="330" rx="8" ry="12" fill="#ff8a65"/>
  <ellipse cx="240" cy="330" rx="8" ry="12" fill="#ff8a65"/>

  <!-- Tail -->
  <path d="M 150 270 Q 100 250 95 180" stroke="#6f3eff" stroke-width="25" fill="none" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Quantum particles around cat -->
  <circle cx="100" cy="100" r="4" fill="#7c3aed" opacity="0.6"/>
  <circle cx="300" cy="150" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="150" cy="350" r="3.5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="320" cy="280" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="80" cy="220" r="3" fill="#7c3aed" opacity="0.6"/>
</svg>
